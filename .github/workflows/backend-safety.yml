name: Command Center backend safety tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Verify truthful health and disabled unsafe CRM routes
        run: node --test test/smoke.test.js
